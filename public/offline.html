<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Offline — ChiperX</title>
<style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;text-align:center;padding:24px}
    .card{max-width:340px;border:1px solid rgba(139,92,246,.35);border-radius:20px;padding:36px 28px;background:rgba(30,41,59,.6)}
    h1{font-size:22px;margin:12px 0 6px;background:linear-gradient(90deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
    p{color:#94a3b8;font-size:14px;line-height:1.6}
    button{margin-top:18px;padding:12px 28px;border:none;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
    <div style="font-size:44px">📡</div>
    <h1>CHIPERX</h1>
    <p>Koneksi terputus. Periksa internetmu — halaman ini akan kembali normal begitu jaringan pulih. 🔌</p>
    <button onclick="location.reload()">🔄 Coba Lagi</button>
</div>
</body>
</html>
