# ============================================================
# ChiperX — Nginx site (front controller pattern)
# ============================================================
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 55m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Blokir dotfile tersembunyi (.env, .git, dll.)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Aset statis dengan cache panjang
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_read_timeout 60s;
        # Cegah eksekusi file phar/upload yang diupload ke public
        location ~* /assets/.*\.php$ {
            deny all;
        }
    }

    # Rate limit ringan untuk endpoint auth & webhook
    location ~ ^/(auth/otp|webhook)/ {
        try_files $uri /index.php?$query_string;
    }
}
